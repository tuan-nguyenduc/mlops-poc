apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tuan-nguyenduc/mlops-poc.git
    targetRevision: main
    path: gitops/model-api
    helm:
      releaseName: model-api
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: model-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Rollout / ServiceMonitor CRDs arrive from other apps; retry until they exist
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        maxDuration: 3m
