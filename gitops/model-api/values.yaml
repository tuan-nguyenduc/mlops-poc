# Model version to serve. Managed by ml/promote.py; Git is the source of truth.
modelVersion: "6"

model:
  name: loan-default

replicas: 4

image:
  repository: mlops-poc/model-api
  tag: "0.1.0"
  pullPolicy: IfNotPresent # image is loaded into kind with `make images`

mlflowTrackingUri: http://mlflow.mlflow.svc.cluster.local:5000

# Chaos knobs, both for demoing automatic canary rollback on purpose.
chaos:
  errorRate: "0" # fraction of /predict calls that fail outright
  predictionBias: "0" # added to every predicted default_probability

canary:
  maxErrorRate: 0.05
  maxP95LatencySeconds: 0.5
  # Canary's "default" prediction rate vs stable's: how far apart they're allowed
  # to be before it's flagged as the new model behaving suspiciously differently.
  maxPredictionShiftRatio: 2.0
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

service:
  nodePort: 30800

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi
