# Overrides on top of ../../values.yaml for the staging environment.
# modelVersion should only change via a reviewed PR promoting a dev-validated version.
# Must be set explicitly (not inherited) so ml/promote.py --values can target it.
modelVersion: "3"
replicas: 2

# No stable host port mapped for staging in kind; reach it with:
#   kubectl -n model-api-staging port-forward svc/model-api 8000:8000
service:
  nodePort: 30802
