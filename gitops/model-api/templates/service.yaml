apiVersion: v1
kind: Service
metadata:
  name: model-api
  labels:
    {{- include "model-api.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "model-api.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
