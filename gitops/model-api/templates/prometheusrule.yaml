apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: model-api
  labels:
    {{- include "model-api.labels" . | nindent 4 }}
spec:
  groups:
    - name: model-api
      rules:
        - alert: ModelApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", path="/predict", status=~"5.."}[5m]))
            / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", path="/predict"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Model API error rate above 5%
        - alert: ModelApiNoModelLoaded
          expr: min(model_loaded{namespace="{{ .Release.Namespace }}"}) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A model-api pod has not loaded its model for 10 minutes
        - alert: ModelApiPredictionShift
          # Average predicted calories moved far from the training mean (~220/100g):
          # possible data or concept drift, or a chaos knob left on in prod.
          expr: |
            sum(rate(model_predicted_calories_sum{namespace="{{ .Release.Namespace }}"}[30m]))
            / sum(rate(model_predicted_calories_count{namespace="{{ .Release.Namespace }}"}[30m])) > 500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Average predicted calories far above the training baseline - check for drift
