apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: model-api
  labels:
    {{- include "model-api.labels" . | nindent 4 }}
spec:
  groups:
    - name: model-api
      rules:
        - alert: ModelApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", path="/predict", status=~"5.."}[5m]))
            / sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", path="/predict"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Model API error rate above 5%
        - alert: ModelApiNoModelLoaded
          expr: min(model_loaded{namespace="{{ .Release.Namespace }}"}) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: A model-api pod has not loaded its model for 10 minutes
        - alert: ModelApiPredictionShift
          # Share of "default" decisions moved a lot: possible data or concept drift
          expr: |
            sum(rate(model_predictions_total{namespace="{{ .Release.Namespace }}", outcome="default"}[30m]))
            / sum(rate(model_predictions_total{namespace="{{ .Release.Namespace }}"}[30m])) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Over 50% of applications predicted to default - check for drift
