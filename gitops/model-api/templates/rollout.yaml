apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: model-api
  labels:
    {{- include "model-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "model-api.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "model-api.selector" . | nindent 8 }}
      annotations:
        mlops-poc/model-version: {{ .Values.modelVersion | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: {{ .Values.mlflowTrackingUri | quote }}
            - name: MODEL_NAME
              value: {{ .Values.model.name | quote }}
            - name: MODEL_VERSION
              value: {{ .Values.modelVersion | quote }}
            - name: CHAOS_ERROR_RATE
              value: {{ .Values.chaos.errorRate | quote }}
            - name: CHAOS_PREDICTION_BIAS
              value: {{ .Values.chaos.predictionBias | quote }}
            - name: HOME
              value: /tmp
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # MLflow downloads model artifacts here
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: model-api-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 100
